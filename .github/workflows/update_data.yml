name: Update Market Data
on:
  schedule:
    # 21:30 UTC Mon–Fri (after the US close) and 09:00 UTC daily (after Asia closes).
    - cron: '30 21 * * 1-5'
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        # -U so yfinance always tracks Yahoo's latest API changes.
        run: pip install -U -r requirements.txt
      - name: Fetch market data
        # Exits non-zero (and writes nothing) if most tickers fail, so a Yahoo
        # outage shows up as a red run instead of an emptied data file.
        run: python3 update_data.py
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add market_data.json
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "chore: update market_data.json"
          git pull --rebase
          git push
