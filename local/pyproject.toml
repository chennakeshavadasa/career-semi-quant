[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semiquant"
version = "1.0.0"
description = "Career Semi Quant Terminal, local edition: live Yahoo Finance data and institutional-grade quant analytics in your browser and terminal."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["finance", "quant", "yfinance", "semiconductors", "options", "risk", "portfolio"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "yfinance>=1.0",
  "pandas>=2.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "arch>=7.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "rich>=13.7",
  "openpyxl>=3.1",
  "plotly>=5.22",
  "pypdf>=4.0",
  "pillow>=10.0",     # page images of scanned Congress reports (pypdf needs it to decode them)
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
semiquant = "semiquant.cli:main"

[project.urls]
Homepage = "https://github.com/chennakeshavadasa/career-semi-quant"
"Web edition" = "https://nithinpuru.github.io/quant-terminal/"

[tool.setuptools.packages.find]
include = ["semiquant*"]

[tool.setuptools.package-data]
semiquant = ["web/*", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
