name: Local edition tests

# Offline unit tests for the local edition (local/): the analytics library against
# known answers and real Yahoo snapshots, plus an API smoke test. No network needed.

on:
  push:
    paths: ["local/**", ".github/workflows/local-tests.yml"]
  pull_request:
    paths: ["local/**", ".github/workflows/local-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: local/pyproject.toml
      - name: Install
        run: python -m pip install -e "local[dev]"
      - name: Unit tests
        working-directory: local
        run: python -m pytest -q
      - name: CLI and server import
        working-directory: local
        run: |
          semiquant --version
          python -c "from semiquant.server.app import create_app; app = create_app(); print(len(app.routes), 'routes')"
