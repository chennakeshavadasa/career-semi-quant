name: Web app (publish + deploy)

# Publishes the web edition (local/ dashboard as static files + data/*.json, made by
# `semiquant publish`) and deploys it with this repo's GitHub Pages:
#   https://chennakeshavadasa.github.io/career-semi-quant/app/     (the Android app loads this)
# The rest of the Pages site (index.html, 404.html, public/) is deployed alongside, unchanged.
#
# One-time setting: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
#
# Refresh tiers inside `semiquant publish` (quotes every run, scores hourly, risk/options
# 3-hourly, fundamentals daily) plus the cache below keep a 15-minute schedule light.
# Live prices don't wait for this: the app streams them from Yahoo directly.

on:
  schedule:
    - cron: "4,19,34,49 7-23 * * 1-5"   # every 15 min: Europe, US pre-market, session, after-hours
    - cron: "4,34 0-6 * * 1-5"          # every 30 min overnight (Asian markets)
    - cron: "4 */3 * * 0,6"             # weekends: every 3 hours
  push:
    branches: [master]
    paths: ["local/semiquant/**", "index.html", "404.html", "public/**", ".github/workflows/webapp.yml"]
  workflow_dispatch:
  # GitHub's branch-based "pages build and deployment" republishes the plain repo files (no app/)
  # after every push to master, so the app 404s until the next run here. Until Settings -> Pages
  # -> Build and deployment -> Source is "GitHub Actions" (which stops those builds), put the
  # last built app back right after one: the check job skips it when the app is still live,
  # and the restore skips the publish (about a minute).
  page_build:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Restores (page_build) get their own queue so they never wait behind a publish run.
  group: ${{ github.event_name == 'page_build' && 'webapp-restore' || 'webapp' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.c.outputs.needed }}
    steps:
      - id: c
        run: |
          if [ "${{ github.event_name }}" != "page_build" ]; then echo "needed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          sleep 30  # let the branch deployment settle
          if curl -sf -o /dev/null "https://chennakeshavadasa.github.io/career-semi-quant/app/data/meta.json?t=$(date +%s)"; then
            echo "The app is live; nothing to restore."
          else
            echo "The app is missing after a branch deployment; restoring the last build."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache keys
        id: k
        run: |
          echo "hour=webapp-$(date -u +%Y%m%d%H)" >> "$GITHUB_OUTPUT"
          echo "week=webapp-pip-$(date -u +%G%V)" >> "$GITHUB_OUTPUT"

      # Previous output + Yahoo cache: each run only redoes what is due. Push runs file their build
      # under their own key (the hour's key is taken by its first run), so a restore right after a
      # push gets the new layout. Restores only read, and always the newest build: saving there filed
      # the older build they redeployed under the hour's key, and later restores brought it back.
      - name: Restore published data
        if: github.event_name != 'page_build'
        uses: actions/cache@v4
        with:
          path: |
            ~/.semiquant/cache
            .qt-out
          key: ${{ github.event_name == 'push' && format('{0}-{1}', steps.k.outputs.hour, github.run_id) || steps.k.outputs.hour }}
          restore-keys: webapp-2
      - name: Restore the newest published build (read only)
        if: github.event_name == 'page_build'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.semiquant/cache
            .qt-out
          key: webapp-restore-${{ github.run_id }}  # never stored: the newest webapp-2* entry wins
          restore-keys: webapp-2

      - name: Restore pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ steps.k.outputs.week }}
          restore-keys: webapp-pip-

      - name: OCR engine (scanned paper Congress reports)
        if: github.event_name != 'page_build'
        continue-on-error: true   # without it those reports stay "unreadable"; nothing else depends on it
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr

      - name: Publish web edition
        if: github.event_name != 'page_build'  # a restore redeploys the cached build as it is
        timeout-minutes: 22
        continue-on-error: true   # a Yahoo hiccup keeps the previous data, never blocks the deploy
        # A push is a code change: the heavy analytics pass (risk, options, statements) gets 2 minutes,
        # so a new layout goes live within minutes instead of after a full data refresh. What it skips
        # stays due and the next scheduled run (12 minutes) does it. Quotes, charts and scores always run.
        run: |
          python -m pip install --quiet ./local
          semiquant publish --out .qt-out --budget ${{ github.event_name == 'push' && 2 || 12 }}

      - name: Assemble site
        run: |
          set -e
          mkdir -p _site
          cp index.html _site/
          [ -f 404.html ] && cp 404.html _site/
          cp -r public _site/public
          if [ -f .qt-out/index.html ]; then
            mkdir -p _site/app && cp -r .qt-out/. _site/app/
          else
            echo "::warning::no published web edition in this run"
          fi
          touch _site/.nojekyll
          du -sh _site _site/app 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
