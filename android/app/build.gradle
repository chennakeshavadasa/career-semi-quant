plugins {
    id 'com.android.application'
}

// CI passes VERSION_CODE (the workflow run number) and KEYSTORE_PASSWORD (repository secret
// ANDROID_KEYSTORE_PASSWORD). The release key is signing/release.p12 (alias "semiquant"),
// useless without that password. Every release must carry this key: Android only installs
// an update signed like the installed app. Without the password the APK is debug-signed
// (local test builds; CI does not publish those).
def versionCodeEnv = Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
def keystorePassword = System.getenv('KEYSTORE_PASSWORD')
def keystoreFile = keystorePassword ? rootProject.file('signing/release.p12').path : null

android {
    namespace 'io.github.nithinpuru.semiquant'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.nithinpuru.semiquant'
        minSdk 26
        targetSdk 35
        versionCode versionCodeEnv
        versionName "1.0.${versionCodeEnv}"
    }

    signingConfigs {
        release {
            if (keystoreFile) {
                storeFile file(keystoreFile)
                storePassword keystorePassword
                keyAlias 'semiquant'
                keyPassword keystorePassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystoreFile ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures { buildConfig true }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
