name: Android app

# Builds the Android app (android/: a WebView on the web edition) and, on master,
# publishes it as the "android" release:
#   https://github.com/chennakeshavadasa/career-semi-quant/releases/download/android/SemiQuant.apk
# Signing: android/signing/release.p12, unlocked by the repository secret
# ANDROID_KEYSTORE_PASSWORD. Every published APK carries that key, so the app can update
# itself (version.json in the release tells it a newer build exists). Without the secret
# the build is debug-signed and NOT published.

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "SIGNED=1" >> "$GITHUB_ENV"
            echo "Signing with the release key (android/signing/release.p12)."
          else
            echo "::warning::Secret ANDROID_KEYSTORE_PASSWORD is not set: debug-signed build, not published (it could not update the installed app)."
          fi

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/SemiQuant.apk"
          ls -l "$GITHUB_WORKSPACE/SemiQuant.apk"
          cat > "$GITHUB_WORKSPACE/version.json" <<JSON
          {"versionCode": ${{ github.run_number }}, "versionName": "1.0.${{ github.run_number }}",
           "apk": "https://github.com/${{ github.repository }}/releases/download/android/SemiQuant.apk",
           "notes": "$(git log -1 --pretty=%s | tr -d '"\\' | cut -c1-140)"}
          JSON
          cat "$GITHUB_WORKSPACE/version.json"

      - uses: actions/upload-artifact@v4
        with:
          name: SemiQuant-apk
          path: |
            SemiQuant.apk
            version.json

      - name: Publish release
        if: github.ref == 'refs/heads/master' && env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --yes --cleanup-tag || true
          gh release create android SemiQuant.apk version.json --target "$GITHUB_SHA" --latest \
            --title "Semi Quant for Android (build ${{ github.run_number }})" \
            --notes "Download SemiQuant.apk on your phone, open it and allow installs from this source. Installed apps update themselves (More > Update app, or the prompt on launch). The app shows the web edition (live Yahoo prices, analytics refreshed every 15 minutes) full screen; exports save to Downloads/SemiQuant."
